<!DOCTYPE html>
<!-- Play Store screenshot template. Render at 1080x1920: screenshot.html?n=1 -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=block" rel="stylesheet">
<style>
  :root { --yellow: #ffcc00; --blue: #00318d; --navy: #061a4a; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: "Bricolage Grotesque", sans-serif; position: relative; }
  body.yellow { background: var(--yellow); color: var(--blue); }
  body.blue { background: var(--blue); color: #fff; }
  body.navy { background: var(--navy); color: #fff; }
  .copy { position: absolute; top: 120px; left: 80px; right: 80px; text-align: center; }
  h1 { font-weight: 800; font-size: 92px; line-height: 1.0; letter-spacing: -2px; }
  p { margin-top: 28px; font-weight: 500; font-size: 42px; line-height: 1.25; opacity: .88; }
  .phone {
    position: absolute; left: 50%; top: 560px; width: 800px; transform: translateX(-50%);
    padding: 22px; border-radius: 84px; background: #111;
    box-shadow: 0 40px 90px rgba(0,0,0,.35), inset 0 0 0 3px #333;
  }
  .phone img { display: block; width: 100%; border-radius: 64px; }
  .phone::before {
    content: ""; position: absolute; top: 44px; left: 50%; width: 30px; height: 30px;
    margin-left: -15px; border-radius: 50%; background: #000; z-index: 2;
  }
  .tag {
    display: inline-block; margin-top: 30px; padding: 10px 26px; border-radius: 999px;
    font-weight: 800; font-size: 32px; background: var(--blue); color: var(--yellow);
  }
  .tag[hidden] { display: none; }
  body.blue .tag, body.navy .tag { background: var(--yellow); color: var(--blue); }
</style>
</head>
<body>
<div class="copy"><h1 id="h"></h1><p id="p"></p><span class="tag" id="t" hidden></span></div>
<div class="phone"><img id="img"></div>
<script>
  const slides = {
    1: ["yellow", "Master Spanish verbs", "Practise conjugations one verb at a time", "637 verbs · 15 tenses &amp; moods"],
    2: ["blue", "No Spanish keyboard? No problem", "Type <b>subirian</b> — Hablito accepts it and shows you <b>subirían</b>"],
    3: ["yellow", "Know when to use each tense", "Tap any tense for a quick explanation with examples"],
    4: ["blue", "Search in Spanish or English", "Look up “to go” and find ir, irse, subir and more"],
    5: ["yellow", "Every verb, every tense", "Full conjugation tables for all 637 verbs"],
    6: ["blue", "Practise what you need", "Pick your tenses, add reflexive or uncommon verbs"],
    7: ["navy", "Hear every conjugation", "Over 56,000 audio clips, plus a dark mode for late-night study"],
  };
  const n = new URLSearchParams(location.search).get("n") || "1";
  const [theme, h, p, tag] = slides[n];
  document.body.className = theme;
  document.getElementById("h").textContent = h;
  document.getElementById("p").innerHTML = p;
  if (tag) { const t = document.getElementById("t"); t.innerHTML = tag; t.hidden = false; }
  document.getElementById("img").src = `raw-${n}.png`;
</script>
</body>
</html>
